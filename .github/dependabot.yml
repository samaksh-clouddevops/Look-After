version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: swift
    directory: /Packages/LookAfterCore
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: swift
    directory: /Packages/LookAfterFeatures
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: swift
    directory: /Packages/LookAfterAI
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: swift
    directory: /Packages/ExecutiveBrain
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
