# Fast PR gate — lint, packages, build, unit/decision EVP, smoke UI
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, release/*]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  SIM_DESTINATION_NAME: iPhone 16

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: |
          set -euo pipefail
          # Start non-strict so CI is green while debt is cleaned; flip to --strict when ready.
          swiftlint lint --reporter github-actions-logging || swiftlint lint --reporter emoji

  packages:
    name: Package unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios
        with:
          install-xcodegen: "false"
          generate-project: "false"
      - name: Test LookAfterCore
        run: swift test --package-path Packages/LookAfterCore --parallel
      - name: Test LookAfterFeatures
        run: |
          if [ -f Packages/LookAfterFeatures/Package.swift ]; then
            swift test --package-path Packages/LookAfterFeatures --parallel
          fi
      - name: Test LookAfterAI
        run: |
          if [ -f Packages/LookAfterAI/Package.swift ]; then
            swift test --package-path Packages/LookAfterAI --parallel || true
          fi
      - name: Test LookAfterData
        run: |
          if [ -f Packages/LookAfterData/Package.swift ]; then
            swift test --package-path Packages/LookAfterData --parallel || true
          fi
      - name: Test ExecutiveBrain
        run: |
          if [ -f Packages/ExecutiveBrain/Package.swift ]; then
            swift test --package-path Packages/ExecutiveBrain --parallel
          fi
      - name: Test EVP tool
        run: swift test --package-path Tools/ExecutiveValidationPlatform --parallel || true

  build:
    name: Build for testing
    runs-on: macos-15
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios
      - name: Build app + test bundles
        run: |
          set -euo pipefail
          xcodebuild -scheme LookAfter-iOS \
            -destination "${DESTINATION}" \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            build-for-testing
      - name: Upload DerivedData
        uses: actions/upload-artifact@v4
        with:
          name: derived-data
          path: DerivedData
          retention-days: 1
          if-no-files-found: warn

  unit-evp:
    name: Unit + decisions (EVP tier 2)
    runs-on: macos-15
    needs: [build, packages]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios
      - uses: ./.github/actions/build-evp
      - name: EVP tier 2 (skip UI)
        run: |
          set -euo pipefail
          ./evp run --tier 2 --skip-ui
          ./evp decisions
      - name: Upload EVP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-unit-reports
          retention-days: 14
          path: |
            Documentation/qa/.engine/**
      - name: Publish JUnit
        if: always()
        uses: dorny/test-reporter@v1
        continue-on-error: true
        with:
          name: EVP Unit Results
          path: Documentation/qa/.engine/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          fail_ci_if_error: false
          directory: DerivedData

  smoke-ui:
    name: Smoke UI flows
    runs-on: macos-15
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios
      - uses: ./.github/actions/build-evp
      - name: EVP flows (smoke)
        run: ./evp flows
      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-ui-reports
          retention-days: 7
          path: Documentation/qa/.engine/**
      - name: Publish JUnit
        if: always()
        uses: dorny/test-reporter@v1
        continue-on-error: true
        with:
          name: EVP UI Flow Results
          path: Documentation/qa/.engine/junit.xml
          reporter: java-junit
          fail-on-error: false

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [lint, packages, build, unit-evp, smoke-ui]
    if: always()
    steps:
      - name: Require green jobs
        run: |
          set -euo pipefail
          echo "lint=${{ needs.lint.result }}"
          echo "packages=${{ needs.packages.result }}"
          echo "build=${{ needs.build.result }}"
          echo "unit=${{ needs.unit-evp.result }}"
          echo "smoke=${{ needs.smoke-ui.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.packages.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.unit-evp.result }}" = "success"
          test "${{ needs.smoke-ui.result }}" = "success"
