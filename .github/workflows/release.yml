# Release gate + optional TestFlight upload
name: Release

on:
  push:
    branches: [release/*]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload archive to TestFlight
        type: boolean
        default: false
      bump:
        description: Version bump (patch|minor|none)
        type: choice
        options: [none, patch, minor]
        default: none

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  checks: write

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  validate:
    name: EVP release gate
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ios
      - uses: ./.github/actions/build-evp
      - name: Full validation + release gate
        run: |
          set -euo pipefail
          UDID=$(xcodebuild -scheme LookAfter-iOS -showdestinations 2>/dev/null \
            | grep 'platform:iOS Simulator' | grep 'iPhone' | head -1 \
            | sed -n 's/.*id:\([^,]*\),.*/\1/p' || true)
          if [ -n "${UDID:-}" ]; then
            xcodebuild -scheme LookAfter-iOS \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath DerivedData build-for-testing
          fi
          ./evp run --tier 2 --skip-ui
          ./evp decisions
          ./evp flows
          ./evp readiness
          ./evp release
      - name: Upload release EVP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evp-${{ github.run_id }}
          retention-days: 90
          path: Documentation/qa/.engine/**

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog fragment
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo "# Changelog"
            echo
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Ref: ${GITHUB_REF_NAME}"
            echo "SHA: ${GITHUB_SHA}"
            echo
            echo "## Commits since previous tag"
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "${PREV:-}" ]; then
              git log "${PREV}..HEAD" --pretty=format:'- %s (%h)' --no-merges
            else
              git log -30 --pretty=format:'- %s (%h)' --no-merges
            fi
          } > dist/CHANGELOG.md
          cat dist/CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: dist/CHANGELOG.md
          retention-days: 90

  archive:
    name: Archive (unsigned CI stub)
    runs-on: macos-26
    needs: [validate]
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.upload_testflight == true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios
      - name: Import signing (optional)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            echo "::warning::No signing secrets — skipping real archive"
            echo "SKIP_ARCHIVE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision
          echo "SKIP_ARCHIVE=0" >> "$GITHUB_ENV"

      - name: Archive
        if: env.SKIP_ARCHIVE != '1'
        run: |
          set -euo pipefail
          xcodebuild -scheme LookAfter-iOS \
            -destination 'generic/platform=iOS' \
            -archivePath dist/LookAfter.xcarchive \
            -configuration Release \
            archive

      - name: Export IPA
        if: env.SKIP_ARCHIVE != '1'
        env:
          EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -n "${EXPORT_OPTIONS_PLIST:-}" ]; then
            echo "$EXPORT_OPTIONS_PLIST" | base64 --decode > dist/ExportOptions.plist
          else
            cat > dist/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          EOF
          fi
          xcodebuild -exportArchive \
            -archivePath dist/LookAfter.xcarchive \
            -exportPath dist/ipa \
            -exportOptionsPlist dist/ExportOptions.plist

      - name: Upload to TestFlight
        if: env.SKIP_ARCHIVE != '1'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APP_STORE_CONNECT_API_KEY_BASE64:-}" ]; then
            echo "::warning::Missing ASC API key — IPA exported but not uploaded"
            exit 0
          fi
          mkdir -p private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file dist/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-binaries
          path: dist/
          retention-days: 90
