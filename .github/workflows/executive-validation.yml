name: Executive Validation Platform

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master, release/*]

jobs:
  evp:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare Firebase config for CI
        run: cp Config/GoogleService-Info.plist.example Config/GoogleService-Info.plist

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app and tests
        run: |
          DEST="$(xcodebuild -scheme LookAfter-iOS -showdestinations 2>/dev/null | grep 'platform:iOS Simulator' | grep 'iPhone' | head -1 | sed -n 's/.*id:\([^,]*\),.*/\1/p')"
          if [ -z "$DEST" ]; then
            echo "No iPhone simulator found; using generic iOS Simulator destination"
            xcodebuild -scheme LookAfter-iOS -destination 'generic/platform=iOS Simulator' build-for-testing
          else
            xcodebuild -scheme LookAfter-iOS -destination "platform=iOS Simulator,id=$DEST" build-for-testing
          fi

      - name: Build EVP
        run: swift build --package-path Tools/ExecutiveValidationPlatform -c release

      - name: Index requirements
        run: ./evp index

      - name: Unit tests and static analysis
        run: ./evp run --tier 2 --skip-ui

      - name: Decision regression (blocking)
        run: ./evp decisions

      - name: Flow automation
        run: ./evp flows

      - name: Visual regression
        run: ./evp visual

      - name: Performance benchmarks
        run: ./evp perf

      - name: Accessibility audit
        run: ./evp a11y

      - name: Reality replay
        run: ./evp replay --fixture REPLAY-001

      - name: Counterfactual
        run: ./evp counterfactual CF-001

      - name: Production readiness
        run: ./evp readiness

      - name: Release gate (release branches)
        if: startsWith(github.ref, 'refs/heads/release/')
        run: ./evp release

      - name: Upload EVP artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evp-reports
          path: |
            Documentation/qa/.engine/results.json
            Documentation/qa/.engine/rtm.json
            Documentation/qa/.engine/dashboard.html
            Documentation/qa/.engine/junit.xml
            Documentation/qa/.engine/cost-history.json
            Documentation/qa/.engine/history.jsonl

      - name: GitHub Step Summary
        if: always()
        run: |
          if [ -f Documentation/qa/.engine/github-summary.md ]; then
            cat Documentation/qa/.engine/github-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
