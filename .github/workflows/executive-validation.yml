# DEPRECATED — split into ci.yml + nightly.yml + release.yml + security.yml
# Kept for manual / emergency full EVP run only.
name: Executive Validation Platform (legacy)

on:
  workflow_dispatch:

concurrency:
  group: evp-legacy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  SIM_DESTINATION_NAME: iPhone 17

jobs:
  evp:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios
      - uses: ./.github/actions/build-evp
      - name: Build for testing
        run: |
          set -euo pipefail
          xcodebuild -scheme LookAfter-iOS \
            -destination "${DESTINATION}" \
            -derivedDataPath DerivedData \
            build-for-testing
      - name: Unit tests and static analysis
        run: ./evp run --tier 2 --skip-ui
      - name: Decision regression (blocking)
        run: ./evp decisions
      - name: Flow automation
        run: ./evp flows
      - name: Visual regression
        run: ./evp visual
      - name: Performance benchmarks
        run: ./evp perf
      - name: Accessibility audit
        run: ./evp a11y
      - name: Reality replay
        run: ./evp replay --fixture REPLAY-001
      - name: Counterfactual
        run: ./evp counterfactual CF-001
      - name: Production readiness
        run: ./evp readiness
      - name: Release gate
        if: startsWith(github.ref, 'refs/heads/release/')
        run: ./evp release
      - name: Upload EVP artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evp-reports
          retention-days: 14
          path: |
            Documentation/qa/.engine/**
      - name: Publish JUnit
        if: always()
        uses: dorny/test-reporter@v1
        continue-on-error: true
        with:
          name: Legacy EVP Results
          path: Documentation/qa/.engine/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: GitHub Step Summary
        if: always()
        run: |
          if [ -f Documentation/qa/.engine/github-summary.md ]; then
            cat Documentation/qa/.engine/github-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
