# Look After — CI-blocking baseline. Tighten gradually; keep signal high.
excluded:
  - .build
  - DerivedData
  - Pods
  - .git
  - Tools/**/.build
  - Packages/**/.build
  - "**/*.generated.swift"
  - Apps/LookAfter-iOS/Generated

included:
  - Apps
  - Packages
  - Tools/ExecutiveValidationPlatform/Sources

opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - joined_default_parameter
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

disabled_rules:
  - trailing_whitespace
  - todo
  - line_length
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - identifier_name

force_cast: warning
force_try: warning
force_unwrapping: warning

reporter: "emoji"
