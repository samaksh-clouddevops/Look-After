name: LookAfter
options:
  bundleIdPrefix: com.samaksh.flowos
  createIntermediateGroups: true
  deploymentTarget:
    iOS: 26.0
    macOS: 26.0
  xcodeVersion: "16.0"
  developmentTeam: QZYBP8F6F5

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_BITCODE: false
    DEVELOPMENT_TEAM: QZYBP8F6F5

targets:
  LookAfter-iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/LookAfter-iOS
      - path: Apps/Shared
      - path: Config/GoogleService-Info.plist
      - path: Config/LookAfter-iOS.entitlements
    entitlements:
      # Personal Team: use LookAfter-iOS.entitlements (no Sign in with Apple).
      # Paid Apple Developer Program: switch to Config/LookAfter-iOS.production.entitlements
      # and add SWIFT_ACTIVE_COMPILATION_CONDITIONS: SIGN_IN_WITH_APPLE
      path: Config/LookAfter-iOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.samaksh.flowos
        # Push Notifications (aps-environment) requires a paid Apple Developer Program account.
        # Add before App Store release: aps-environment: production
    info:
      path: Apps/LookAfter-iOS/Info.plist
      properties:
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        # Set after Azure deploy, e.g. https://lookafter-auth-xxxx.azurecontainerapps.io
        AuthProxyBaseURL: "https://lookafter-auth-d3mssrdbjuy6c.yellowhill-50dac6a6.eastus.azurecontainerapps.io"
        NSHealthShareUsageDescription: "Look After reads sleep, heart rate, HRV, steps, active energy, exercise and stand time, workouts, blood oxygen, mindful minutes, water intake, and menstrual-cycle data from Apple Health (including Apple Watch) to estimate energy and personalize scheduling. Cycle data is used only when that feature is enabled."
        NSLocationWhenInUseUsageDescription: "Look After uses your location only to show local weather on Today when you open that chip."
        NSCalendarsFullAccessUsageDescription: "Look After reads your calendar to find free blocks and meeting-aware scheduling windows."
        NSCalendarsWriteOnlyAccessUsageDescription: "Look After needs access to your calendar to add scheduled tasks and sync events."
        NSMicrophoneUsageDescription: "Look After uses the microphone for voice capture and speech-to-text transcription."
        NSSpeechRecognitionUsageDescription: "Look After transcribes your spoken thoughts into tasks, journal entries, and notes."
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.samaksh.flowos.app.notification-refresh
          - com.samaksh.flowos.app.behavioral-telemetry
        CFBundleURLTypes:
          - CFBundleURLName: com.samaksh.flowos.app.lookafter
            CFBundleURLSchemes:
              - lookafter
          - CFBundleURLName: com.samaksh.flowos.app.firebase-oauth
            CFBundleURLSchemes:
              - app-1-36164607296-ios-4c41b48bef64b912d72ea5
              - com.googleusercontent.apps.36164607296-ahtmjo7pnthd83ejlfpn88cr795dth3n
        GIDClientID: 36164607296-ahtmjo7pnthd83ejlfpn88cr795dth3n.apps.googleusercontent.com
    dependencies:
      - target: LookAfterWidget
        embed: true
      - package: LookAfterCore
      - package: LookAfterAI
      - package: LookAfterData
      - package: LookAfterHealth
      - package: LookAfterFeatures
    preBuildScripts:
      - name: Ensure GoogleService-Info.plist
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${SRCROOT}/Config/GoogleService-Info.plist"
          EXAMPLE="${SRCROOT}/Config/GoogleService-Info.plist.example"
          if [ ! -f "$PLIST" ] && [ -f "$EXAMPLE" ]; then
            cp "$EXAMPLE" "$PLIST"
            echo "Created GoogleService-Info.plist from example template."
          fi
    postBuildScripts:
      - name: Sync Firebase OAuth URL schemes
        basedOnDependencyAnalysis: false
        script: |
          /bin/bash "${SRCROOT}/Scripts/sync-firebase-url-schemes.sh"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.samaksh.flowos.app
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Config/LookAfter-iOS.entitlements
      OTHER_LDFLAGS: $(inherited) -ObjC
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      INFOPLIST_KEY_CFBundleDisplayName: "Look After"
      INFOPLIST_KEY_NSHealthShareUsageDescription: "Look After reads sleep, heart rate, HRV, steps, active energy, exercise and stand time, workouts, blood oxygen, mindful minutes, water intake, and menstrual-cycle data from Apple Health (including Apple Watch) to estimate energy and personalize scheduling. Cycle data is used only when that feature is enabled."
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Look After uses your location only to show local weather on Today when you open that chip."
      INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Look After reads your calendar to find free blocks and meeting-aware scheduling windows."
      INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Look After needs access to your calendar to add scheduled tasks and sync events."
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "Look After uses the microphone for voice capture and speech-to-text transcription."
      INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Look After transcribes your spoken thoughts into tasks, journal entries, and notes."
      INFOPLIST_KEY_NSSupportsLiveActivities: true

  LookAfterWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/LookAfterWidget
      - path: Apps/Shared
    entitlements:
      path: Apps/LookAfterWidget/LookAfterWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.samaksh.flowos
    dependencies:
      - package: LookAfterCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.samaksh.flowos.app.widget
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Apps/LookAfterWidget/LookAfterWidget.entitlements
      INFOPLIST_KEY_CFBundleDisplayName: "Look After"
      INFOPLIST_FILE: Apps/LookAfterWidget/Info.plist
      SKIP_INSTALL: true
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  LookAfter-macOS:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/LookAfter-macOS
      - path: Config/GoogleService-Info.plist
      - path: Config/LookAfter-macOS.entitlements
      # Speech + TTS used by BrainDashboardView / InboxView on the Mac shell.
      - path: Apps/LookAfter-iOS/Services/SpeechRecognitionManager.swift
      - path: Apps/LookAfter-iOS/Services/PlanningSpeechSynthesizer.swift
      - path: Apps/LookAfter-iOS/Services/VoiceSessionKeepAlive.swift
      - path: Apps/LookAfter-iOS/Services/OpenAICloudTTSService.swift
      # These SwiftUI screens are shared by the macOS dashboard. The iOS-only
      # master canvas and Daily Plan timer intentionally remain excluded.
      - path: Apps/LookAfter-iOS/Views/ADHD
      - path: Apps/LookAfter-iOS/Views/Brain
      - path: Apps/LookAfter-iOS/Views/Coach
      - path: Apps/LookAfter-iOS/Views/Inbox
      - path: Apps/LookAfter-iOS/Views/Settings
        excludes:
          - SettingsView.swift
          - HealthTroubleshootingView.swift
      - path: Apps/LookAfter-iOS/Views/Shared
        excludes:
          - HealthSyncProgressView.swift
          - LifeProfileImportView.swift
          - VoiceCaptureView.swift
      - path: Apps/LookAfter-iOS/Views/Tasks
        excludes:
          - DailyPlanView.swift
    dependencies:
      - package: LookAfterCore
      - package: LookAfterAI
      - package: LookAfterData
      - package: LookAfterFeatures
      - package: LookAfterHealth
    preBuildScripts:
      - name: Ensure GoogleService-Info.plist
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${SRCROOT}/Config/GoogleService-Info.plist"
          EXAMPLE="${SRCROOT}/Config/GoogleService-Info.plist.example"
          if [ ! -f "$PLIST" ] && [ -f "$EXAMPLE" ]; then
            cp "$EXAMPLE" "$PLIST"
            echo "Created GoogleService-Info.plist from example template."
          fi
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.samaksh.lifeos.mac
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Look After"
      INFOPLIST_KEY_AuthProxyBaseURL: "https://lookafter-auth-d3mssrdbjuy6c.yellowhill-50dac6a6.eastus.azurecontainerapps.io"
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Look After reads your calendar for scheduling."
      INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Look After needs access to your calendar to add scheduled tasks."
      CODE_SIGN_ENTITLEMENTS: Config/LookAfter-macOS.entitlements
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  LookAfterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Packages/LookAfterData/Tests/LookAfterDataTests
      - path: Packages/LookAfterData/Tests/BehaviorMemoryStoreTests
      - path: Packages/LookAfterData/Tests/EnvironmentContextProviderTests
      - path: Packages/LookAfterCore/Tests/LookAfterCoreTests
      - path: Packages/LookAfterCore/Tests/FlowSchedulingTests
      - path: Packages/LookAfterAI/Tests/LookAfterAITests
      - path: Packages/LookAfterAI/Tests/FlowDirectorTests
      - path: Packages/LookAfterFeatures/Tests/LookAfterFeaturesTests
        excludes:
          - TestCalendarFixtures.swift
      - path: Packages/ExecutiveBrain/Tests/ExecutiveBrainTests
      - path: Packages/LookAfterHealth/Tests/LookAfterHealthTests
    dependencies:
      - package: LookAfterData
      - package: LookAfterCore
      - package: LookAfterAI
      - package: LookAfterFeatures
      - package: ExecutiveBrain
      - package: LookAfterHealth
    settings:
      GENERATE_INFOPLIST_FILE: YES

  LookAfterUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/LookAfterTestSupport
      - path: Apps/LookAfterUITests
    dependencies:
      - target: LookAfter-iOS
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: LookAfter-iOS

  LookAfterSnapshotTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/LookAfterTestSupport
      - path: Apps/LookAfterSnapshotTests
    dependencies:
      - target: LookAfter-iOS
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: LookAfter-iOS

packages:
  LookAfterCore:
    path: Packages/LookAfterCore
  LookAfterAI:
    path: Packages/LookAfterAI
  LookAfterData:
    path: Packages/LookAfterData
  LookAfterHealth:
    path: Packages/LookAfterHealth
  LookAfterFeatures:
    path: Packages/LookAfterFeatures
  ExecutiveBrain:
    path: Packages/ExecutiveBrain

schemes:
  LookAfter-iOS:
    build:
      targets:
        LookAfter-iOS: all
        LookAfterWidget: all
        LookAfterTests: [test]
        LookAfterUITests: [test]
        LookAfterSnapshotTests: [test]
    test:
      targets:
        - name: LookAfterTests
        - name: LookAfterUITests
        - name: LookAfterSnapshotTests
    run:
      config: Debug
  LookAfter-macOS:
    build:
      targets:
        LookAfter-macOS: all
    run:
      config: Debug
