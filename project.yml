name: LookAfter
options:
  bundleIdPrefix: com.samaksh.flowos
  createIntermediateGroups: true
  deploymentTarget:
    iOS: 17.0
    macOS: 14.0
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: false

targets:
  LookAfter-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/LookAfter-iOS
      - path: Apps/Shared
      - path: Config/GoogleService-Info.plist
      - path: Config/LookAfter-iOS.entitlements
    entitlements:
      path: Config/LookAfter-iOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.samaksh.flowos
        # Push Notifications (aps-environment) requires a paid Apple Developer Program account.
        # Add before App Store release: aps-environment: production
    info:
      path: Apps/LookAfter-iOS/Info.plist
      properties:
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "Look After reads sleep, heart rate, HRV, steps, and workout data from Apple Health (including Apple Watch) to estimate your energy levels and personalize task recommendations."
        NSCalendarsFullAccessUsageDescription: "Look After reads your calendar to find free blocks and meeting-aware scheduling windows."
        NSCalendarsWriteOnlyAccessUsageDescription: "Look After needs access to your calendar to add scheduled tasks and sync events."
        NSMicrophoneUsageDescription: "Look After uses the microphone for voice capture and speech-to-text transcription."
        NSSpeechRecognitionUsageDescription: "Look After transcribes your spoken thoughts into tasks, journal entries, and notes."
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.samaksh.flowos.app.notification-refresh
    dependencies:
      - target: LookAfterWidget
        embed: true
      - package: LookAfterCore
      - package: LookAfterAI
      - package: LookAfterData
      - package: LookAfterHealth
      - package: LookAfterFeatures
    preBuildScripts:
      - name: Ensure GoogleService-Info.plist
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${SRCROOT}/Config/GoogleService-Info.plist"
          EXAMPLE="${SRCROOT}/Config/GoogleService-Info.plist.example"
          if [ ! -f "$PLIST" ] && [ -f "$EXAMPLE" ]; then
            cp "$EXAMPLE" "$PLIST"
            echo "Created GoogleService-Info.plist from example template."
          fi
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.samaksh.flowos.app
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Config/LookAfter-iOS.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleDisplayName: "Look After"
      INFOPLIST_KEY_NSHealthShareUsageDescription: "Look After analyzes your sleep, HRV, and heart rate to estimate energy levels."
      INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Look After reads your calendar for scheduling."
      INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Look After needs access to your calendar to add scheduled tasks."
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "Look After uses the microphone for voice capture and speech-to-text transcription."
      INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Look After transcribes your spoken thoughts into tasks, journal entries, and notes."
      INFOPLIST_KEY_NSSupportsLiveActivities: true

  LookAfterWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/LookAfterWidget
      - path: Apps/Shared
    entitlements:
      path: Apps/LookAfterWidget/LookAfterWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.samaksh.flowos
    dependencies:
      - package: LookAfterCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.samaksh.flowos.app.widget
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Apps/LookAfterWidget/LookAfterWidget.entitlements
      INFOPLIST_KEY_CFBundleDisplayName: "Look After"
      INFOPLIST_FILE: Apps/LookAfterWidget/Info.plist
      SKIP_INSTALL: true
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  LookAfter-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Apps/LookAfter-macOS
      - path: Config/GoogleService-Info.plist
      - path: Config/LookAfter-macOS.entitlements
      # These SwiftUI screens are shared by the macOS dashboard. The iOS-only
      # master canvas and Daily Plan timer intentionally remain excluded.
      - path: Apps/LookAfter-iOS/Views/ADHD
      - path: Apps/LookAfter-iOS/Views/Brain
      - path: Apps/LookAfter-iOS/Views/Coach
      - path: Apps/LookAfter-iOS/Views/Inbox
      - path: Apps/LookAfter-iOS/Views/Settings
        excludes:
          - SettingsView.swift
      - path: Apps/LookAfter-iOS/Views/Shared
        excludes:
          - HealthSyncProgressView.swift
          - LifeProfileImportView.swift
          - VoiceCaptureView.swift
      - path: Apps/LookAfter-iOS/Views/Tasks
        excludes:
          - DailyPlanView.swift
    dependencies:
      - package: LookAfterCore
      - package: LookAfterAI
      - package: LookAfterData
      - package: LookAfterFeatures
      - package: LookAfterHealth
    preBuildScripts:
      - name: Ensure GoogleService-Info.plist
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${SRCROOT}/Config/GoogleService-Info.plist"
          EXAMPLE="${SRCROOT}/Config/GoogleService-Info.plist.example"
          if [ ! -f "$PLIST" ] && [ -f "$EXAMPLE" ]; then
            cp "$EXAMPLE" "$PLIST"
            echo "Created GoogleService-Info.plist from example template."
          fi
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.samaksh.lifeos.mac
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Look After"
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Look After reads your calendar for scheduling."
      INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Look After needs access to your calendar to add scheduled tasks."
      CODE_SIGN_ENTITLEMENTS: Config/LookAfter-macOS.entitlements

  LookAfterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/LookAfterData/Tests/LookAfterDataTests
      - path: Packages/LookAfterData/Tests/BehaviorMemoryStoreTests
      - path: Packages/LookAfterData/Tests/EnvironmentContextProviderTests
      - path: Packages/LookAfterCore/Tests/LookAfterCoreTests
      - path: Packages/LookAfterCore/Tests/FlowSchedulingTests
      - path: Packages/LookAfterAI/Tests/LookAfterAITests
      - path: Packages/LookAfterAI/Tests/FlowDirectorTests
      - path: Packages/LookAfterFeatures/Tests/LookAfterFeaturesTests
        excludes:
          - TestCalendarFixtures.swift
      - path: Packages/ExecutiveBrain/Tests/ExecutiveBrainTests
      - path: Packages/LookAfterHealth/Tests/LookAfterHealthTests
    dependencies:
      - package: LookAfterData
      - package: LookAfterCore
      - package: LookAfterAI
      - package: LookAfterFeatures
      - package: ExecutiveBrain
      - package: LookAfterHealth
    settings:
      GENERATE_INFOPLIST_FILE: YES

  LookAfterUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/LookAfterTestSupport
      - path: Apps/LookAfterUITests
    dependencies:
      - target: LookAfter-iOS
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: LookAfter-iOS

  LookAfterSnapshotTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/LookAfterTestSupport
      - path: Apps/LookAfterSnapshotTests
    dependencies:
      - target: LookAfter-iOS
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: LookAfter-iOS

packages:
  LookAfterCore:
    path: Packages/LookAfterCore
  LookAfterAI:
    path: Packages/LookAfterAI
  LookAfterData:
    path: Packages/LookAfterData
  LookAfterHealth:
    path: Packages/LookAfterHealth
  LookAfterFeatures:
    path: Packages/LookAfterFeatures
  ExecutiveBrain:
    path: Packages/ExecutiveBrain

schemes:
  LookAfter-iOS:
    build:
      targets:
        LookAfter-iOS: all
        LookAfterWidget: all
        LookAfterTests: [test]
        LookAfterUITests: [test]
        LookAfterSnapshotTests: [test]
    test:
      targets:
        - name: LookAfterTests
        - name: LookAfterUITests
        - name: LookAfterSnapshotTests
    run:
      config: Debug
  LookAfter-macOS:
    build:
      targets:
        LookAfter-macOS: all
    run:
      config: Debug
