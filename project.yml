name: LifeOS
options:
  bundleIdPrefix: com.samaksh.flowos
  createIntermediateGroups: true
  deploymentTarget:
    iOS: 17.0
    macOS: 14.0
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: false

targets:
  LifeOS-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/LifeOS-iOS
      - path: Apps/Shared
      - path: Config/GoogleService-Info.plist
      - path: Config/LifeOS-iOS.entitlements
    entitlements:
      path: Config/LifeOS-iOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.samaksh.flowos
    info:
      path: Apps/LifeOS-iOS/Info.plist
      properties:
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "Look After reads sleep, heart rate, HRV, steps, and workout data from Apple Health (including Apple Watch) to estimate your energy levels and personalize task recommendations."
        NSCalendarsFullAccessUsageDescription: "Look After reads your calendar to find free blocks and meeting-aware scheduling windows."
        NSCalendarsWriteOnlyAccessUsageDescription: "Look After needs access to your calendar to add scheduled tasks and sync events."
        NSMicrophoneUsageDescription: "Look After uses the microphone for voice capture and speech-to-text transcription."
        NSSpeechRecognitionUsageDescription: "Look After transcribes your spoken thoughts into tasks, journal entries, and notes."
    dependencies:
      - target: LifeOSWidget
        embed: true
      - package: LifeOSCore
      - package: LifeOSAI
      - package: LifeOSData
      - package: LifeOSHealth
      - package: LifeOSFeatures
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.samaksh.flowos.app
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Config/LifeOS-iOS.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleDisplayName: "Look After"
      INFOPLIST_KEY_NSHealthShareUsageDescription: "Look After analyzes your sleep, HRV, and heart rate to estimate energy levels."
      INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Look After reads your calendar for scheduling."
      INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Look After needs access to your calendar to add scheduled tasks."
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "Look After uses the microphone for voice capture and speech-to-text transcription."
      INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Look After transcribes your spoken thoughts into tasks, journal entries, and notes."
      INFOPLIST_KEY_NSSupportsLiveActivities: true

  LifeOSWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/LifeOSWidget
      - path: Apps/Shared
    entitlements:
      path: Apps/LifeOSWidget/LifeOSWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.samaksh.flowos
    dependencies:
      - package: LifeOSCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.samaksh.flowos.app.widget
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Apps/LifeOSWidget/LifeOSWidget.entitlements
      INFOPLIST_KEY_CFBundleDisplayName: "Look After"
      INFOPLIST_FILE: Apps/LifeOSWidget/Info.plist
      SKIP_INSTALL: true
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  LifeOS-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Apps/LifeOS-macOS
      - path: Config/GoogleService-Info.plist
      - path: Config/LifeOS-macOS.entitlements
      # These SwiftUI screens are shared by the macOS dashboard. The iOS-only
      # master canvas and Daily Plan timer intentionally remain excluded.
      - path: Apps/LifeOS-iOS/Views/ADHD
      - path: Apps/LifeOS-iOS/Views/Brain
      - path: Apps/LifeOS-iOS/Views/Coach
      - path: Apps/LifeOS-iOS/Views/Inbox
      - path: Apps/LifeOS-iOS/Views/Settings
        excludes:
          - SettingsView.swift
      - path: Apps/LifeOS-iOS/Views/Shared
        excludes:
          - HealthSyncProgressView.swift
          - LifeProfileImportView.swift
          - VoiceCaptureView.swift
      - path: Apps/LifeOS-iOS/Views/Tasks
        excludes:
          - DailyPlanView.swift
    dependencies:
      - package: LifeOSCore
      - package: LifeOSAI
      - package: LifeOSData
      - package: LifeOSFeatures
      - package: LifeOSHealth
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.samaksh.lifeos.mac
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Look After"
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Look After reads your calendar for scheduling."
      INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Look After needs access to your calendar to add scheduled tasks."
      CODE_SIGN_ENTITLEMENTS: Config/LifeOS-macOS.entitlements

  LifeOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/LifeOSData/Tests/LifeOSDataTests
      - path: Packages/LifeOSData/Tests/BehaviorMemoryStoreTests
      - path: Packages/LifeOSData/Tests/EnvironmentContextProviderTests
      - path: Packages/LifeOSCore/Tests/LifeOSCoreTests
      - path: Packages/LifeOSCore/Tests/FlowSchedulingTests
      - path: Packages/LifeOSAI/Tests/LifeOSAITests
      - path: Packages/LifeOSAI/Tests/FlowDirectorTests
      - path: Packages/LifeOSFeatures/Tests/LifeOSFeaturesTests
        excludes:
          - TestCalendarFixtures.swift
      - path: Packages/ExecutiveBrain/Tests/ExecutiveBrainTests
      - path: Packages/LifeOSHealth/Tests/LifeOSHealthTests
    dependencies:
      - package: LifeOSData
      - package: LifeOSCore
      - package: LifeOSAI
      - package: LifeOSFeatures
      - package: ExecutiveBrain
      - package: LifeOSHealth
    settings:
      GENERATE_INFOPLIST_FILE: YES

packages:
  LifeOSCore:
    path: Packages/LifeOSCore
  LifeOSAI:
    path: Packages/LifeOSAI
  LifeOSData:
    path: Packages/LifeOSData
  LifeOSHealth:
    path: Packages/LifeOSHealth
  LifeOSFeatures:
    path: Packages/LifeOSFeatures
  ExecutiveBrain:
    path: Packages/ExecutiveBrain

schemes:
  LifeOS-iOS:
    build:
      targets:
        LifeOS-iOS: all
        LifeOSWidget: all
        LifeOSTests: [test]
    test:
      targets:
        - name: LifeOSTests
    run:
      config: Debug
  LifeOS-macOS:
    build:
      targets:
        LifeOS-macOS: all
    run:
      config: Debug
